# Holt stündlich (und auf Knopfdruck) die Kataloge der einzelnen Plugins und schreibt den gemeinsamen neu.
name: Katalog aktualisieren
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zusammensetzen
        run: python3 scripts/merge.py
      - name: Übernehmen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json staging.json
          git diff --cached --quiet || { git commit -m "Katalog aktualisiert"; git push; }
